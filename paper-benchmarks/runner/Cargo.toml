[package]
name = "benchmark-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmark orchestrator: CDK deploy → iam-policy-autopilot → temporary exec role → run → CDK destroy."

# The library is named `iac_runner` so the benchmark crates can `use iac_runner::…`.
[lib]
name = "iac_runner"
path = "src/lib.rs"

[dependencies]
aws-config         = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-iam        = "1"
aws-sdk-sts        = "1"
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
chrono             = { version = "0.4", features = ["serde"] }
anyhow             = "1"
tracing            = "0.1"

[dev-dependencies]
rstest     = "0.26"
serde_json = "1"
serde      = { version = "1", features = ["derive"] }
